server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # VitePress 开启了 cleanUrls：/foo 实际对应磁盘上的 /foo.html
    # 先试原始路径，再试 .html，再试目录，最后 404
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # 带 hash 的静态资源长期缓存（JS/CSS/图片/字体）
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|eot|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 防止目录遍历
    location ~ /\. {
        deny all;
    }
}
